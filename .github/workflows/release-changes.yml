name: Release Changes

on: 
  push:
    branches:
      - main
      - notifyOnFail

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Throw a failure
      - name: Create failure
        run: exit 1

      # Handle failure and notify
      - name: Handle failure
        env:
          test_secret: ${{secrets.NOTIFICATION_WEBHOOK}}
        if: failure()
        run: |
          echo "Release failed! Issues encountered"
          if [ -z "$test_secret" ]; then
            echo "Could not find secret"
          else
            FULL_SHA = ${{github.sha}}
            SHORTENED_SHA = ${FULL_SHA:0:6}
            curl -X POST -H 'Content-type: application/json' --data '{"text":"*Open Source Pipeline Failure!*\n>An issue occurred in commit: <${{github.server_url}}/${{github.repository}}/commit/${FULL_SHA}|${SHORTENED_SHA}...>"}' $test_secret
          fi