name: Release Changes

on: 
  push:
    branches:
      - main
      - notifyOnFail

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Throw a failure
      - name: Create failure
        run: exit 1

      # Handle failure and notify
      - name: Handle failure
        env:
          test_secret: ${{secrets.TEST_SECRET}}
        if: failure()
        run: |
          echo "Release failed! Issues encountered"
          if ([string]::IsNullOrEmpty($env:test_secret)) {
            echo "Could not find secret"
          }
          else {
            echo "Secret Found"
          }