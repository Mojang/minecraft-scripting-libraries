name: Release Changes

on: 
  push:
    branches:
      - main
      - notifyOnFail

jobs:
  build:
    if: github.actor != 'mc-npm'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm OIDC trusted publishing
      contents: read # required for actions/checkout

    steps:
      # Throw a failure
      - name: Create failure
        run: exit 1

      # Handle failure and notify
      - name: Handle failure
        if: always()
        run: echo "Release failed! Issues encountered"